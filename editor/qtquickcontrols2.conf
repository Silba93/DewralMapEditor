; Styl Qt Quick Controls. Domyslny na Windows to styl natywny ("Windows"), ktory
; renderuje Menu/MenuItem natywnie i IGNORUJE wlasny delegate/contentItem (menu
; mialo zolte natywne podswietlenie i centrowany tekst mimo stylowania). "Basic"
; w pelni respektuje wlasne delegaty - wymagany dla classic-UI reskina.
; Qt czyta ten plik automatycznie z :/qtquickcontrols2.conf przy starcie.
[Controls]
Style=Basic
